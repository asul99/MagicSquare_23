[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "magic-square"
version = "0.1.0"
description = "4x4 magic square domain (ECB)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["magic_square*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-m", "not red_phase"]
markers = [
    "red_phase: Intentional RED TDD stubs (see Reporter/21, docs/TC_D2_unit_magic_square_entity_user_sample.md); run: pytest -m red_phase",
]
