[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "magic-square"
version = "0.1.0"
description = "4x4 magic square domain (ECB)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["magic_square*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
