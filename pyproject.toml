[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "magic-square"
version = "0.1.0"
description = "4x4 magic square domain (ECB)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
gui = ["PyQt6>=6.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["magic_square*", "magicsquare*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-m", "not red_phase"]
markers = [
    "red_phase: Intentional RED TDD stubs under tests/red_phase/{logic,boundary,ui}; run: pytest -m red_phase",
]
